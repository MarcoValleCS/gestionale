name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Anche il pacchetto MCP: senza, i test degli strumenti MCP
          # (apps.core.tests_mcp) verrebbero saltati.
          pip install -r requirements-mcp.txt

      - name: Esegui i test
        env:
          DJANGO_SECRET_KEY: chiave-di-test-non-usare-in-produzione
          DJANGO_DEBUG: "true"
        run: python manage.py test apps --verbosity=2

  # Gli strumenti MCP girano in produzione su PostgreSQL: qui vengono
  # verificati anche lì (in locale e nel job sopra girano su SQLite).
  test-mcp-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gestionale
          POSTGRES_USER: gestionale
          POSTGRES_PASSWORD: gestionale
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-mcp.txt

      - name: Esegui i test MCP su PostgreSQL
        env:
          DJANGO_SECRET_KEY: chiave-di-test-non-usare-in-produzione
          DJANGO_DEBUG: "true"
          DB_ENGINE: postgresql
          DB_NAME: gestionale
          DB_USER: gestionale
          DB_PASSWORD: gestionale
          DB_HOST: localhost
          DB_PORT: "5432"
        run: python manage.py test apps.core.tests_mcp --verbosity=2
