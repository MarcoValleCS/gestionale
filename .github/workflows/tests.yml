name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Anche il pacchetto MCP: senza, i test degli strumenti MCP
          # (apps.core.tests_mcp) verrebbero saltati.
          pip install -r requirements-mcp.txt

      - name: Esegui i test
        env:
          DJANGO_SECRET_KEY: chiave-di-test-non-usare-in-produzione
          DJANGO_DEBUG: "true"
        run: python manage.py test apps --verbosity=2
