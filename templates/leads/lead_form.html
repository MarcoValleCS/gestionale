{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="card mb-3">
        <div class="card-header">{{ page_title }}</div>
        <div class="card-body">{% include "partials/form_fields.html" %}</div>
      </div>
      <div class="d-flex gap-2 mb-4">
        <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Salva</button>
        <a class="btn btn-outline-secondary" href="{{ cancel_url }}">Annulla</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
