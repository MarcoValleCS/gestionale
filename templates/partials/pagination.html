{% if page_obj.paginator.num_pages > 1 %}
<nav class="mt-3 no-print" aria-label="Paginazione">
  <ul class="pagination pagination-sm mb-0">
    <li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">
      <a class="page-link" href="?{% querystring page=page_obj.previous_page_number %}">&laquo; Precedente</a>
    </li>
    <li class="page-item disabled">
      <span class="page-link">Pagina {{ page_obj.number }} di {{ page_obj.paginator.num_pages }}</span>
    </li>
    <li class="page-item {% if not page_obj.has_next %}disabled{% endif %}">
      <a class="page-link" href="?{% querystring page=page_obj.next_page_number %}">Successiva &raquo;</a>
    </li>
  </ul>
</nav>
{% endif %}
