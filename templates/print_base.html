{% load static %}<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>{{ document.number }} · {{ company.name|default:"Gestionale" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="bg-white">
  <div class="no-print bg-light border-bottom py-2 mb-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="btn btn-outline-secondary btn-sm" href="{% block back_url %}#{% endblock %}">
        <i class="bi bi-arrow-left"></i> Torna indietro
      </a>
      <button class="btn btn-primary btn-sm" onclick="window.print()">
        <i class="bi bi-printer"></i> Stampa / Salva PDF
      </button>
    </div>
  </div>
  <div class="print-sheet">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
