{% load static %}<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · {{ company.name|default:"Gestionale" }}</title>
  <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="login-page">
  <div class="container py-5 text-center" style="max-width: 420px">
    <div class="login-brand-icon mx-auto mb-3"><i class="bi bi-wifi-off"></i></div>
    <h1 class="h4 text-white mb-2">Sei offline</h1>
    <p class="text-white-50 mb-4">Il gestionale ha bisogno della connessione per mostrare i dati aggiornati. Controlla la rete e riprova.</p>
    <button class="btn btn-primary" onclick="location.reload()"><i class="bi bi-arrow-clockwise"></i> Riprova</button>
