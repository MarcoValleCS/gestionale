{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header">{{ page_title }}</div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "partials/form_fields.html" %}
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Salva</button>
            <a class="btn btn-outline-secondary" href="{% url 'core:vat_list' %}">Annulla</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
