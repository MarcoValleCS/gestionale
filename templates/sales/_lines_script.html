<script>
(function () {
  const prefix = "lines";
  const totalFormsInput = document.getElementById("id_" + prefix + "-TOTAL_FORMS");
  const tableBody = document.getElementById("lines-body");
  const templateEl = document.getElementById("empty-line-template");
  if (!totalFormsInput || !tableBody || !templateEl) return;

  const vatRates = JSON.parse(document.getElementById("vat-rates-data").textContent);
  const currency = new Intl.NumberFormat("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  /* Costo di acquisto della riga: serve a mostrare il margine in diretta.
     Priorità: il costo fissato sulla riga (ordini già consegnati), poi quello
     dell'articolo scelto. Il dizionario "product-costs" contiene solo i costi
     degli articoli già presenti nel documento. */
  const costsEl = document.getElementById("product-costs");
  const productCosts = costsEl ? JSON.parse(costsEl.textContent) : {};

  function rowCost(row) {
    const valore = row.dataset.cost;
    if (valore !== undefined && valore !== null && String(valore).trim() !== "") {
      const numero = parseNumber(valore);
      if (!isNaN(numero)) return numero;
    }
    const productSelect = row.querySelector('[name$="-product"]');
    const chiave = productSelect ? String(productSelect.value || "") : "";
    if (chiave && productCosts[chiave] !== undefined) return parseNumber(productCosts[chiave]);
    return 0;
  }

  function parseNumber(value) {
    if (!value) return 0;
    return parseFloat(String(value).replace(/\s/g, "").replace(",", ".")) || 0;
  }

  function isDeleted(row) {
    const checkbox = row.querySelector('input[type="checkbox"][name$="-DELETE"]');
    return checkbox && checkbox.checked;
  }

  /* Tipo riga: «article» è la riga normale, gli altri sono righe di testo
     (sezione, sottosezione, nota) senza prezzo né quantità. */
  function lineType(row) {
    const field = row.querySelector('[name$="-line_type"]');
    return field && field.value ? field.value : "article";
  }

  function isDisplay(row) {
    return lineType(row) !== "article";
  }

  const DISPLAY_PLACEHOLDERS = {
    section: "Titolo della sezione (es. Bagno padronale)",
    subsection: "Titolo della sottosezione",
    note: "Nota o descrizione libera",
  };

  /* Sezione, sottosezione e nota occupano l'intera riga: si nascondono le
     colonne di prezzo e la descrizione si allarga (come in Odoo). */
  function applyLineType(row) {
    const tipo = lineType(row);
    const display = tipo !== "article";
    row.classList.toggle("line-display", display);
    row.classList.remove("line-type-section", "line-type-subsection", "line-type-note");
    if (display) row.classList.add("line-type-" + tipo);
    row.querySelectorAll(".cell-articolo, .cell-qta, .cell-um, .cell-prezzo, .cell-sconto, .cell-iva, .cell-totale, .cell-margine")
      .forEach(function (cell) { cell.style.display = display ? "none" : ""; });
    const descCell = row.querySelector(".cell-descrizione");
    if (descCell) descCell.colSpan = display ? 10 : 1;
    const desc = row.querySelector('[name$="-description"]');
    if (desc) desc.placeholder = display ? (DISPLAY_PLACEHOLDERS[tipo] || "") : "";
  }

  /* La posizione salvata segue l'ordine visibile delle righe (frecce su/giù). */
  function renumber() {
    let posizione = 1;
    tableBody.querySelectorAll("tr.line-row").forEach(function (row) {
      if (row.classList.contains("d-none") || isDeleted(row)) return;
      const field = row.querySelector('[name$="-position"]');
      if (field) field.value = posizione;
      posizione += 1;
    });
  }

  function rigaVisibile(row, direzione) {
    let fratello = direzione < 0 ? row.previousElementSibling : row.nextElementSibling;
    while (fratello) {
      if (!fratello.classList.contains("d-none") && !isDeleted(fratello)) return fratello;
      fratello = direzione < 0 ? fratello.previousElementSibling : fratello.nextElementSibling;
    }
    return null;
  }

  function moveLine(row, direzione) {
    const altra = rigaVisibile(row, direzione);
    if (!altra) return;
    if (direzione < 0) tableBody.insertBefore(row, altra);
    else tableBody.insertBefore(altra, row);
    renumber();
    recalc();
  }

  /* Il pulsante «apri scheda articolo» si attiva solo quando la riga ha un articolo. */
  function aggiornaPulsanteArticolo(row) {
    const pulsante = row.querySelector("[data-open-product]");
    const select = row.querySelector('[name$="-product"]');
    if (!pulsante || !select) return;
    pulsante.disabled = !select.value;
  }

  function recalc() {
    let subtotal = 0;
    let costoTotale = 0;
    const vatMap = {};
    tableBody.querySelectorAll("tr.line-row").forEach(function (row) {
      if (isDeleted(row) || isDisplay(row)) return;
      const qtyField = row.querySelector('[name$="-qty"]');
      const priceField = row.querySelector('[name$="-unit_price"]');
      const discountField = row.querySelector('[name$="-discount_pct"]');
      const vatSelect = row.querySelector('[name$="-vat_rate"]');
      const qty = parseNumber(qtyField && qtyField.value);
      const price = parseNumber(priceField && priceField.value);
      const discount = parseNumber(discountField && discountField.value);
      const vatPk = vatSelect ? vatSelect.value : "";
      const rate = vatPk && vatRates[vatPk] ? parseFloat(vatRates[vatPk]) : 0;
      const lineSubtotal = qty * price * (1 - discount / 100);
      const lineVat = lineSubtotal * rate / 100;
      subtotal += lineSubtotal;
      const cell = row.querySelector(".line-total");
      // Importo di riga = imponibile (q.tà × prezzo scontato): deve quadrare
      // con i subtotali di sezione/sottosezione e con la stampa, dove l'IVA
      // esce solo nel riepilogo. Prima mostrava l'IVA inclusa e i conti non tornavano.
      if (cell) cell.textContent = currency.format(lineSubtotal) + " €";

      // margine della riga: prezzo netto meno costo di acquisto
      const cost = rowCost(row);
      const lineCost = cost * qty;
      costoTotale += lineCost;
      const margine = lineSubtotal - lineCost;
      const marginCell = row.querySelector(".line-margin-value");
      const marginPctCell = row.querySelector(".line-margin-pct");
      const mostraMargine = cost > 0 || margine !== 0;
      if (marginCell) {
        marginCell.textContent = mostraMargine ? currency.format(margine) + " €" : "—";
        marginCell.classList.toggle("text-danger", margine < 0);
        marginCell.classList.toggle("text-success", margine > 0);
      }
      if (marginPctCell) {
        marginPctCell.textContent = lineSubtotal > 0 && cost > 0
          ? (margine / lineSubtotal * 100).toFixed(1).replace(".", ",") + " %"
          : "";
      }

      if (vatPk) {
        vatMap[vatPk] = vatMap[vatPk] || { rate: rate, base: 0, vat: 0 };
        vatMap[vatPk].base += lineSubtotal;
        vatMap[vatPk].vat += lineVat;
      }
    });
    let vatTotal = 0;
    Object.values(vatMap).forEach(function (entry) { vatTotal += entry.vat; });

    const subtotalEl = document.getElementById("totals-subtotal");
    const vatEl = document.getElementById("totals-vat");
    const grandEl = document.getElementById("totals-grand");
    if (subtotalEl) subtotalEl.textContent = currency.format(subtotal) + " €";
    if (vatEl) vatEl.textContent = currency.format(vatTotal) + " €";
    if (grandEl) grandEl.textContent = currency.format(subtotal + vatTotal) + " €";

    // riepilogo margine del documento
    const costEl = document.getElementById("totals-cost");
    const marginEl = document.getElementById("totals-margin");
    const marginPctEl = document.getElementById("totals-margin-pct");
    const margineTotale = subtotal - costoTotale;
    if (costEl) costEl.textContent = currency.format(costoTotale) + " €";
    if (marginEl) {
      marginEl.textContent = currency.format(margineTotale) + " €";
      marginEl.classList.toggle("text-danger", margineTotale < 0);
      marginEl.classList.toggle("text-success", margineTotale > 0);
    }
    if (marginPctEl) {
      marginPctEl.textContent = subtotal > 0 && costoTotale > 0
        ? (margineTotale / subtotal * 100).toFixed(1).replace(".", ",") + " %"
        : "—";
    }
    const commissionEl = document.getElementById("totals-commission");
    const commissionField = document.getElementById("id_commission_pct");
    if (commissionEl && commissionField) {
      const pct = parseNumber(commissionField.value);
      commissionEl.textContent = currency.format(subtotal * pct / 100) + " €";
    }

    const breakdown = document.getElementById("vat-breakdown");
    if (breakdown) {
      breakdown.innerHTML = "";
      Object.values(vatMap)
        .sort(function (a, b) { return b.rate - a.rate; })
        .forEach(function (entry) {
          const div = document.createElement("div");
          div.className = "d-flex justify-content-between small text-muted";
          div.innerHTML = "<span>IVA " + entry.rate + "%</span><span>" +
            currency.format(entry.base) + " € + " + currency.format(entry.vat) + " €</span>";
          breakdown.appendChild(div);
        });
    }
  }

  function fillFromProduct(row) {
    const productSelect = row.querySelector('[name$="-product"]');
    if (!productSelect) return;
    // cambiando articolo il costo torna quello dell'anagrafica
    delete row.dataset.cost;
    const baseUrl = productSelect.dataset.defaultsUrl;
    if (!baseUrl || !productSelect.value) return;
    const url = baseUrl.replace("/0/", "/" + productSelect.value + "/");
    const params = new URLSearchParams();
    params.set("context", productSelect.dataset.context || "sale");
    const supplierField = document.getElementById("id_supplier");
    if (supplierField && supplierField.value) params.set("supplier", supplierField.value);
    fetch(url + "?" + params.toString())
      .then(function (response) { return response.json(); })
      .then(function (data) {
        const desc = row.querySelector('[name$="-description"]');
        if (desc && !desc.value.trim()) desc.value = data.description;
        const uom = row.querySelector('[name$="-uom"]');
        if (uom && data.uom_id) uom.value = data.uom_id;
        const price = row.querySelector('[name$="-unit_price"]');
        if (price) price.value = data.price;
        const vat = row.querySelector('[name$="-vat_rate"]');
        if (vat && data.vat_id) vat.value = data.vat_id;
        // Quantità e sconto non arrivano dall'articolo: se la riga è vuota
        // (tipico dopo un salvataggio fallito) si ripristinano i default,
        // altrimenti resterebbero a mano a 0/vuoto.
        ensureQtyAndDiscount(row);
        // il costo dell'articolo serve al calcolo del margine
        if (data.cost !== undefined && data.cost !== null) {
          row.dataset.cost = data.cost;
        }
        recalc();
        if (data.components && data.components.length) {
          expandKit(row, productSelect, data.components);
        }
      })
      .catch(function () { /* ignora errori di rete */ });
  }

  /* Kit/composizione: aggiunge sotto la riga i componenti (a prezzo zero,
     così il prezzo del kit resta quello della riga principale). */
  function expandKit(row, productSelect, components) {
    const marker = String(productSelect.value);
    if (row.dataset.kitExpanded === marker) return;
    row.dataset.kitExpanded = marker;
    components.forEach(function (component) {
      addRow({
        product: component.id,
        productLabel: component.label,
        description: component.description,
        qty: component.qty,
        unitPrice: "0",
      });
    });
  }

  function bindRow(row) {
    const productSelect = row.querySelector('[name$="-product"]');
    if (productSelect) productSelect.addEventListener("change", function () { fillFromProduct(row); });
    row.querySelectorAll('input, select').forEach(function (field) {
      field.addEventListener("input", recalc);
      field.addEventListener("change", recalc);
    });
    // frecce su/giù: spostano la riga dentro la tabella
    row.querySelectorAll(".move-line").forEach(function (button) {
      button.addEventListener("click", function () {
        moveLine(row, parseInt(button.dataset.dir, 10) || 0);
      });
    });
    applyLineType(row);
    // pulsante «apri la scheda articolo»: attivo solo se c'è un articolo scelto
    const apriArticolo = row.querySelector("[data-open-product]");
    if (apriArticolo) {
      aggiornaPulsanteArticolo(row);
      apriArticolo.addEventListener("click", function () {
        const select = row.querySelector('[name$="-product"]');
        const base = apriArticolo.dataset.productUrl || "";
        if (select && select.value && base) {
          window.open(base.replace("/0/", "/" + select.value + "/"), "_blank");
        }
      });
      if (productSelect) {
        productSelect.addEventListener("change", function () { aggiornaPulsanteArticolo(row); });
      }
    }
    const removeButton = row.querySelector(".remove-line");
    if (removeButton) {
      removeButton.addEventListener("click", function () {
        // Si nasconde sempre invece di rimuovere dal DOM: gli indici del
        // formset (lines-0, lines-1…) devono restare contigui, altrimenti al
        // salvataggio successivo Django riceve buchi e ricrea righe spurie.
        const checkbox = row.querySelector('input[type="checkbox"][name$="-DELETE"]');
        if (checkbox) checkbox.checked = true;
        row.classList.add("d-none");
        renumber();
        recalc();
      });
    }
  }

  function setSelectValue(select, value, label) {
    if (!select || value === null || value === undefined || value === "") return;
    let option = Array.prototype.find.call(select.options, function (o) { return o.value === String(value); });
    if (!option && label) {
      option = new Option(label, value, true, true);
      select.add(option);
    }
    if (option) select.value = option.value;
  }

  function setFieldValue(row, selector, value) {
    const field = row.querySelector(selector);
    if (field && value !== undefined && value !== null) field.value = value;
  }

  /* Riempie una riga con valori dati senza innescare l'autocompletamento
     (usato dal caricamento dei modelli di preventivo). */
  function fillRow(row, values) {
    const productSelect = row.querySelector('[name$="-product"]');
    setSelectValue(productSelect, values.product, values.productLabel);
    const searchInput = row.querySelector("[data-autocomplete]");
    if (searchInput) {
      const option = productSelect ? productSelect.selectedOptions[0] : null;
      searchInput.value = option && option.value ? option.text : "";
    }
    setFieldValue(row, '[name$="-description"]', values.description);
    setFieldValue(row, '[name$="-line_type"]', values.lineType);
    // Quantità di default: i componenti kit la passano, le righe nuove no.
    if (values.qty === undefined || values.qty === null || String(values.qty).trim() === "") {
      values.qty = "1";
    }
    setFieldValue(row, '[name$="-qty"]', values.qty);
    setSelectValue(row.querySelector('[name$="-uom"]'), values.uom);
    setFieldValue(row, '[name$="-unit_price"]', values.unitPrice);
    setFieldValue(row, '[name$="-discount_pct"]', values.discount);
    setSelectValue(row.querySelector('[name$="-vat_rate"]'), values.vat);
    aggiornaPulsanteArticolo(row);
    applyLineType(row);
  }

  function addRow(values) {
    const index = parseInt(totalFormsInput.value, 10) || 0;
    const html = templateEl.innerHTML.replace(/__prefix__/g, index);
    const wrapper = document.createElement("tbody");
    wrapper.innerHTML = html.trim();
    const row = wrapper.firstElementChild;
    if (!row) return null;
    tableBody.appendChild(row);
    totalFormsInput.value = index + 1;
    bindRow(row);
    if (values) fillRow(row, values);
    applyLineType(row);
    applyCustomerDiscount(row);
    renumber();
    recalc();
    // se è una riga di testo, il cursore va subito sul titolo
    if (values && values.lineType && values.lineType !== "article") {
      const desc = row.querySelector('[name$="-description"]');
      if (desc) desc.focus();
    }
    return row;
  }

  /* Sconto abituale del cliente proposto nelle righe (solo se la riga è a 0). */
  const customerDiscountsEl = document.getElementById("customer-discounts");
  const customerDiscounts = customerDiscountsEl ? JSON.parse(customerDiscountsEl.textContent) : {};
  const customerDiscountSelect = document.getElementById("id_customer");

  function currentCustomerDiscount() {
    if (!customerDiscountSelect) return 0;
    const raw = customerDiscounts[customerDiscountSelect.value];
    const numero = parseNumber(raw);
    return isNaN(numero) ? 0 : numero;
  }

  function ensureQtyAndDiscount(row) {
    if (isDisplay(row) || isDeleted(row)) return;
    const qtyField = row.querySelector('[name$="-qty"]');
    if (qtyField && (String(qtyField.value || "").trim() === "" || parseNumber(qtyField.value) === 0)) {
      qtyField.value = "1";
    }
    const discountField = row.querySelector('[name$="-discount_pct"]');
    const scontoCliente = currentCustomerDiscount();
    if (discountField && scontoCliente) {
      const current = parseFloat(String(discountField.value || "").replace(",", "."));
      if (String(discountField.value || "").trim() === "" || isNaN(current) || current === 0) {
        discountField.value = String(scontoCliente).replace(".", ",");
      }
    }
  }

  function applyCustomerDiscount(row) {
    if (!customerDiscountSelect) return;
    if (isDisplay(row)) return;
    const discount = customerDiscounts[customerDiscountSelect.value];
    if (!discount) return;
    const field = row.querySelector('[name$="-discount_pct"]');
    if (!field) return;
    const current = parseFloat(String(field.value || "").replace(",", "."));
    if (String(field.value || "").trim() === "" || isNaN(current) || current === 0) {
      field.value = discount;
    }
  }

  if (customerDiscountSelect) {
    customerDiscountSelect.addEventListener("change", function () {
      tableBody.querySelectorAll("tr.line-row").forEach(function (row) {
        applyCustomerDiscount(row);
      });
      recalc();
    });
  }

  /* Pulsanti «Aggiungi»: riga normale, sezione, sottosezione, nota. */
  document.querySelectorAll("[data-add-line-type]").forEach(function (button) {
    button.addEventListener("click", function () {
      const tipo = button.dataset.addLineType || "article";
      if (tipo === "article") {
        addRow();
      } else {
        addRow({ lineType: tipo, qty: "1", unitPrice: "0", discount: "0" });
      }
    });
  });

  /* Compatibilità: i moduli senza sezioni usano ancora il solo «Aggiungi riga». */
  const addButton = document.getElementById("add-line");
  if (addButton && !addButton.dataset.addLineType) {
    addButton.addEventListener("click", function () { addRow(); });
  }

  /* API usata dagli altri script (modelli di preventivo, creazioni rapide) */
  window.GestionaleLines = { addRow: addRow, recalc: recalc, renumber: renumber };

  function linesFeedback(message) {
    let box = document.getElementById("lines-feedback");
    if (!box) return;
    if (!message) {
      box.classList.add("d-none");
      box.textContent = "";
      return;
    }
    box.classList.remove("d-none");
    box.innerHTML = "<i class='bi bi-exclamation-triangle me-1'></i>" + message;
  }

  function validateLines() {
    let primoErrore = null;
    tableBody.querySelectorAll("tr.line-row").forEach(function (row) {
      if (row.classList.contains("d-none") || isDeleted(row)) {
        row.classList.remove("line-invalid");
        return;
      }
      const desc = row.querySelector('[name$="-description"]');
      if (isDisplay(row) && desc && desc.value.trim() === "") {
        row.classList.add("line-invalid");
        desc.classList.add("is-invalid");
        if (!primoErrore) primoErrore = desc;
      } else {
        row.classList.remove("line-invalid");
        if (desc) desc.classList.remove("is-invalid");
      }
    });
    if (primoErrore) {
      const tipo = lineType(primoErrore.closest("tr")) || "article";
      const nomi = { section: "della sezione", subsection: "della sottosezione", note: "della nota" };
      linesFeedback("Scrivi il titolo " + (nomi[tipo] || "della riga") + " evidenziata prima di salvare (le righe vuote vanno compilate o eliminate con il cestino).");
      primoErrore.focus();
      primoErrore.scrollIntoView({ block: "center", behavior: "smooth" });
      return false;
    }
    linesFeedback(null);
    return true;
  }

  tableBody.querySelectorAll("tr.line-row").forEach(function (row) {
    bindRow(row);
    // Dopo un salvataggio fallito il server rimanda le righe marcate DELETE:
    // restano nascoste invece di riapparire.
    if (isDeleted(row)) row.classList.add("d-none");
    else ensureQtyAndDiscount(row);
    const desc = row.querySelector('[name$="-description"]');
    if (desc) {
      desc.addEventListener("input", function () {
        if (desc.value.trim() !== "") {
          desc.classList.remove("is-invalid");
          desc.closest("tr").classList.remove("line-invalid");
        }
      });
    }
  });
  const documentForm = document.getElementById("document-form");

  /* Avviso modifiche non salvate: banner + conferma prima di uscire.
     Le impostazioni programmate all'avvio (rinumerazione, default q.tà e
     sconto) non sparano eventi, quindi non sporcano lo stato iniziale. */
  let formSubmitting = false;
  let bypassNavigate = false;
  let formDirty = false;
  let unsavedBanner = null;
  function showUnsavedBanner() {
    if (!unsavedBanner) return;
    unsavedBanner.classList.remove("d-none");
    unsavedBanner.classList.add("d-flex");
  }
  function markFormDirty() {
    if (formDirty) return;
    formDirty = true;
    showUnsavedBanner();
  }
  if (documentForm) {
    unsavedBanner = document.createElement("div");
    unsavedBanner.id = "unsaved-banner";
    unsavedBanner.className = "alert alert-warning d-none align-items-center justify-content-between gap-3 flex-wrap py-2 px-3 mb-3";
    unsavedBanner.setAttribute("role", "alert");
    const testo = document.createElement("div");
    testo.innerHTML = "<i class='bi bi-exclamation-triangle-fill me-2'></i><strong>Modifiche non salvate.</strong> Salva prima di tornare indietro o le perderai.";
    const salvaBtn = document.createElement("button");
    salvaBtn.type = "button";
    salvaBtn.className = "btn btn-warning btn-sm";
    salvaBtn.innerHTML = "<i class='bi bi-check-lg me-1'></i>Salva ora";
    salvaBtn.addEventListener("click", function () {
      documentForm.requestSubmit();
    });
    unsavedBanner.appendChild(testo);
    unsavedBanner.appendChild(salvaBtn);
    documentForm.prepend(unsavedBanner);
    documentForm.addEventListener("input", markFormDirty);
    documentForm.addEventListener("change", markFormDirty);
    documentForm.addEventListener("submit", function (event) {
      if (!validateLines()) {
        event.preventDefault();
        return;
      }
      formSubmitting = true;
    });
    document.addEventListener("click", function (event) {
      if (!formDirty || formSubmitting || bypassNavigate) return;
      const anchor = event.target && event.target.closest ? event.target.closest('a[href]') : null;
      if (!anchor || anchor.target === "_blank") return;
      const href = anchor.getAttribute("href") || "";
      if (!href || href.charAt(0) === "#" || href.indexOf("javascript:") === 0) return;
      if (anchor.closest(".autocomplete-menu")) return;
      event.preventDefault();
      if (window.confirm("Hai modifiche non salvate. Tornare indietro senza salvare? Le modifiche andranno perse.")) {
        bypassNavigate = true;
        window.location.href = anchor.href;
      }
    });
    window.addEventListener("beforeunload", function (event) {
      if (formSubmitting || bypassNavigate || !formDirty) return;
      event.preventDefault();
      event.returnValue = "";
    });
  }
  renumber();
  recalc();
})();
</script>
