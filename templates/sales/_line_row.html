<tr class="line-row" data-cost="{{ lineform.instance.unit_cost|default:'' }}">
  <td class="d-none">{{ lineform.id }}</td>
  <td>
    <div class="autocomplete-wrap">
      <div class="input-group input-group-sm flex-nowrap">
        <input type="text" class="form-control autocomplete-input" autocomplete="off" placeholder="Cerca articolo…"
               data-autocomplete="{% url 'catalog:search' %}"
               data-target="#{{ lineform.product.id_for_label }}"
               data-kind="product">
        <button class="btn btn-outline-primary" type="button" data-quick-product title="Crea nuovo articolo">
          <i class="bi bi-plus-lg"></i>
        </button>
        <button class="btn btn-outline-secondary" type="button" data-open-product
                data-product-url="{% url 'catalog:product_detail' 0 %}"
                title="Apri la scheda dell'articolo" disabled>
          <i class="bi bi-box-arrow-up-right"></i>
        </button>
      </div>
      {{ lineform.product }}
    </div>
  </td>
  <td>{{ lineform.description }}</td>
  <td>{{ lineform.section }}</td>
  <td>{{ lineform.qty }}</td>
  <td>{{ lineform.uom }}</td>
  <td>{{ lineform.unit_price }}</td>
  <td>{{ lineform.discount_pct }}</td>
  <td>{{ lineform.vat_rate }}</td>
  <td class="text-end line-total text-nowrap">—</td>
  <td class="text-end line-margin text-nowrap">
    <span class="line-margin-value">—</span>
    <div class="small line-margin-pct text-muted"></div>
  </td>
  <td class="text-center text-nowrap">
    <button type="button" class="btn btn-outline-danger btn-sm remove-line" title="Rimuovi riga">
      <i class="bi bi-trash"></i>
    </button>
    <span class="d-none">{{ lineform.DELETE }}</span>
  </td>
</tr>
