<text x="30" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Il gestionale prepara l&#x27;XML FatturaPA e lo trasmette via PEC; le ricevute si registrano a mano.</text>
<rect x="30" y="95" width="170" height="62" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
