<text x="810.0" y="245.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Scartata</text>
<text x="810.0" y="264.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">correggi e ritrasmetti</text>
<text x="30" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Conservazione sostitutiva e ricevute complete restano a carico del conservatore o del commercialista.</text>
