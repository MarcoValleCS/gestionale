<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="titolo">
<title id="titolo">Dal fabbisogno al pagamento: il flusso degli acquisti</title>
<defs>
  <marker id="freccia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
</defs>
<rect width="1000" height="380" fill="#ffffff"/>
<text x="30" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Dal fabbisogno al pagamento: il flusso degli acquisti</text>
<text x="30" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Il fabbisogno nasce da un ordine cliente, da una scorta minima o da un ordine inserito a mano.</text>
<rect x="25" y="95" width="140" height="62" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="95.0" y="121.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">Fabbisogno</text>
<text x="95.0" y="140.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">ordine / sotto scorta</text>
<rect x="195" y="95" width="150" height="62" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="270.0" y="121.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">Ordine fornitore</text>
<text x="270.0" y="140.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">bozza</text>
<rect x="375" y="95" width="120" height="62" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
<text x="435.0" y="121.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">Invio</text>
<text x="435.0" y="140.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">email o PDF</text>
<rect x="525" y="95" width="160" height="62" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="605.0" y="121.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">Ricezione merce</text>
<text x="605.0" y="140.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">carico a magazzino</text>
<rect x="715" y="95" width="160" height="62" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="795.0" y="121.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">Fattura ricevuta</text>
<text x="795.0" y="140.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">da pagare</text>
<rect x="895" y="95" width="100" height="62" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="945.0" y="121.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">Pagamento</text>
<text x="945.0" y="140.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">scadenzario</text>
<line x1="165" y1="126" x2="195" y2="126" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<line x1="345" y1="126" x2="375" y2="126" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<text x="360.0" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">inviato</text>
<line x1="495" y1="126" x2="525" y2="126" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<text x="510.0" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">arriva</text>
<line x1="685" y1="126" x2="715" y2="126" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<text x="700.0" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">fattura</text>
<line x1="875" y1="126" x2="895" y2="126" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<line x1="95" y1="157" x2="95" y2="215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<rect x="25" y="215" width="240" height="50" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="145.0" y="235.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Articolo senza fornitore</text>
<text x="145.0" y="254.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">assegnalo in anagrafica</text>
<line x1="605" y1="157" x2="605" y2="215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<rect x="480" y="215" width="220" height="50" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="590.0" y="235.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Ricezione parziale</text>
<text x="590.0" y="254.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">stato «parzialmente ricevuto»</text>
<line x1="795" y1="157" x2="795" y2="215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<rect x="720" y="215" width="180" height="50" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="810.0" y="235.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Scadenzario fornitori</text>
<text x="810.0" y="254.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">da pagare / pagata</text>
<text x="30" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">La ricezione carica il magazzino; la fattura può essere creata dall&#x27;ordine fornitore e le righe si copiano.</text>
</svg>
