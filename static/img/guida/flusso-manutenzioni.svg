<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="titolo">
<title id="titolo">Manutenzioni programmate</title>
<defs>
  <marker id="freccia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
</defs>
<rect width="1000" height="370" fill="#ffffff"/>
<text x="30" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Manutenzioni programmate</text>
<text x="30" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">La dashboard avvisa 30 giorni prima; da lì si segna l&#x27;intervento o si crea il preventivo.</text>
<rect x="30" y="95" width="190" height="62" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="125.0" y="121.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Piano</text>
<text x="125.0" y="140.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">cliente, frequenza, prossima data</text>
<rect x="270" y="95" width="190" height="62" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="365.0" y="121.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">In scadenza</text>
<text x="365.0" y="140.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">entro 30 giorni</text>
<rect x="510" y="95" width="190" height="62" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="605.0" y="121.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Eseguita</text>
<text x="605.0" y="140.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">data e note</text>
<rect x="750" y="95" width="200" height="62" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
<text x="850.0" y="121.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Prossima scadenza</text>
<text x="850.0" y="140.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">calcolata dalla frequenza</text>
<line x1="220" y1="126" x2="270" y2="126" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<text x="245.0" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">avviso</text>
<line x1="460" y1="126" x2="510" y2="126" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<text x="485.0" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">intervento</text>
<line x1="700" y1="126" x2="750" y2="126" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<text x="725.0" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">avanza</text>
<line x1="365" y1="157" x2="365" y2="215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<rect x="270" y="215" width="190" height="50" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="365.0" y="235.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Crea preventivo</text>
<text x="365.0" y="254.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">dal modello collegato</text>
<line x1="460" y1="240" x2="520" y2="240" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<rect x="520" y="215" width="190" height="50" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="615.0" y="235.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Preventivo → ordine</text>
<text x="615.0" y="254.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">nuovo lavoro</text>
<text x="30" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Frequenze: mensile, bimestrale, trimestrale, semestrale, annuale o personalizzata.</text>
</svg>
