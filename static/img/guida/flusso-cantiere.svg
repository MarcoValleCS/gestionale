<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="titolo">
<title id="titolo">Il cantiere è il contenitore del lavoro</title>
<defs>
  <marker id="freccia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
</defs>
<rect width="1000" height="470" fill="#ffffff"/>
<text x="30" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Il cantiere è il contenitore del lavoro</text>
<text x="30" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Documenti, ore, foto, manutenzioni e fatturazione fanno capo allo stesso cantiere.</text>
<rect x="390" y="195" width="220" height="76" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
<text x="500.0" y="228.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a">CANTIERE</text>
<text x="500.0" y="247.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">cliente · stato · responsabile</text>
<rect x="30" y="80" width="210" height="60" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="135.0" y="105.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">Preventivi</text>
<text x="135.0" y="124.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">offerte e accettazioni</text>
<line x1="240" y1="110" x2="390" y2="233" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<rect x="30" y="170" width="210" height="60" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="135.0" y="195.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">Ordini cliente</text>
<text x="135.0" y="214.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">lavori confermati</text>
<line x1="240" y1="200" x2="390" y2="233" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<rect x="30" y="260" width="210" height="60" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="135.0" y="285.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">Ordini fornitore</text>
<text x="135.0" y="304.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">materiali e carenze</text>
<line x1="240" y1="290" x2="390" y2="233" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<rect x="30" y="350" width="210" height="60" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="135.0" y="375.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">DDT</text>
<text x="135.0" y="394.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">consegne e scarichi</text>
<line x1="240" y1="380" x2="390" y2="233" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<rect x="750" y="80" width="220" height="60" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="860.0" y="105.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">Fatture</text>
<text x="860.0" y="124.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">emesse e ricevute</text>
<line x1="610" y1="233" x2="750" y2="110" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<rect x="750" y="170" width="220" height="60" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="860.0" y="195.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">Acconti / SAL / saldo</text>
<text x="860.0" y="214.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">avanzamento lavori</text>
<line x1="610" y1="233" x2="750" y2="200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<rect x="750" y="260" width="220" height="60" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="860.0" y="285.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">Ore e presenze</text>
<text x="860.0" y="304.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">dipendenti e collaboratori</text>
<line x1="610" y1="233" x2="750" y2="290" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<rect x="750" y="350" width="220" height="60" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
<text x="860.0" y="375.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">Foto e manutenzioni</text>
<text x="860.0" y="394.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">cantiere e assistenza</text>
<line x1="610" y1="233" x2="750" y2="380" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#freccia)"/>
<text x="30" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Nelle schede dei documenti scegli il cantiere: così costi, ricavi, ore e foto si ritrovano insieme.</text>
</svg>
