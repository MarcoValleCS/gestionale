x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gestionale}
      POSTGRES_USER: ${DB_USER:-gestionale}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Impostare DB_PASSWORD nel file .env}
    # Configurazione tarata su un VPS piccolo (1 vCPU / 1 GB RAM)
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=384MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=25"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "max_wal_size=512MB"
    shm_size: "256mb"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gestionale} -d ${DB_NAME:-gestionale}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_DEBUG: "false"
      DJANGO_HTTPS: "true"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    logging: *default-logging

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
