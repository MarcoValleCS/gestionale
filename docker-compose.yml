x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gestionale}
      POSTGRES_USER: ${DB_USER:-gestionale}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Impostare DB_PASSWORD nel file .env}
    # Configurazione tarata su un VPS piccolo (1 vCPU / 1 GB RAM)
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=384MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=25"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "max_wal_size=512MB"
    shm_size: "256mb"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gestionale} -d ${DB_NAME:-gestionale}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Se un processo viene compromesso non può guadagnare privilegi aggiuntivi.
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging: *default-logging

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_DEBUG: "false"
      DJANGO_HTTPS: "true"
      # Dove il contenitore vede i backup notturni (in sola lettura)
      BACKUP_ROOT: /backups
    volumes:
      - media:/app/media
      # I backup restano sul server: da qui si possono scaricare dal gestionale
      # per tenerne una copia su un altro computer.
      - ${BACKUP_HOST_DIR:-/opt/backups/gestionale}:/backups:ro
    depends_on:
      db:
        condition: service_healthy
    # Attende che Gunicorn abbia finito le richieste in corso (graceful-timeout 30s).
    stop_grace_period: 40s
    # Se un processo viene compromesso non può guadagnare privilegi aggiuntivi.
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      # L'app risponde? Si accettano 200 e i redirect (login, Django admin).
      # Niente curl nell'immagine: si usa il Python già presente.
      test: ["CMD", "python", "-c", "import http.client as h; c=h.HTTPConnection('127.0.0.1',8000,timeout=5); c.request('GET','/accounts/login/'); r=c.getresponse(); exit(0 if r.status in (200,301,302) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Parte solo quando l'app è pronta: meno errori 502 all'avvio e agli aggiornamenti.
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging: *default-logging

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
